name: landslide_app
description: "NER Landslide Early Warning & Disaster Management Android Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  
  # Secure Storage & Cache
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Interactive GIS Mapping & Coordinates
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # GPS & Geolocation
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Camera & Media
  image_picker: ^1.0.7
  
  # UI & Visuals
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  lucide_icons: ^0.257.0
  fl_chart: ^0.66.0
  uuid: ^4.3.3
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
